name: Feature request
description: An idea for something this app could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe what keeps happening or what you cannot do today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
